<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Board</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Mini Board</h1>
      <p>Node 서버가 HTML 파일을 읽어서 브라우저에 응답했습니다.</p>

      <section>
        <h2>지금 확인할 수 있는 주소</h2>
        <ul>
          <li><a href="/">첫 화면</a></li>
          <li><a href="/api/posts">게시글 JSON 목록</a></li>
          <li><a href="/api/posts/1">첫 번째 게시글 JSON</a></li>
          <li><a href="/api/health">서버 상태 JSON</a></li>
        </ul>
      </section>

      <section>
        <h2>정적 파일 확인</h2>
        <p id="static-message">브라우저 JavaScript 파일을 불러오는 중입니다.</p>
      </section>

      <section>
        <h2>게시글 작성</h2>
        <form id="post-form" class="post-form">
          <label>
            제목
            <input id="post-title" name="title" type="text" required>
          </label>

          <label>
            내용
            <textarea id="post-content" name="content" rows="4" required></textarea>
          </label>

          <label>
            작성자
            <input id="post-author" name="author" type="text" placeholder="익명">
          </label>

          <button type="submit">게시글 저장</button>
        </form>
        <p id="form-message" class="form-message"></p>
      </section>

      <section>
        <h2>게시글 목록</h2>
        <p id="posts-status">게시글을 불러오는 중입니다.</p>
        <ul id="posts-list" class="posts-list"></ul>
      </section>
    </main>
  </body>
</html>
