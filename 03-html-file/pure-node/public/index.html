<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pure Node HTML 파일 읽기</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #202124;
        background: #f6f8fb;
      }

      main {
        max-width: 720px;
        margin: 48px auto;
        padding: 32px;
        background: white;
        border: 1px solid #d8dee8;
        border-radius: 8px;
      }

      code {
        padding: 2px 6px;
        background: #eef2f7;
        border-radius: 4px;
      }

      a {
        color: #0b57d0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pure Node HTML 파일 읽기</h1>
      <p>
        이 화면은 서버 코드 안에 직접 적은 HTML이 아니라
        <code>public/index.html</code> 파일을 읽어서 보여주는 화면입니다.
      </p>
      <p>
        Pure Node에서는 파일 읽기, 응답 헤더 지정, 404 처리까지 직접 작성합니다.
      </p>
      <p>
        <a href="/not-found">없는 주소로 이동해서 404 처리 보기</a>
      </p>
    </main>
  </body>
</html>
