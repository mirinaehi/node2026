<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입과 로그인</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <h1>회원가입과 로그인</h1>
    <!-- 입력은 브라우저가 받고, 가입과 로그인 처리는 app.js가 서버 API에 요청합니다. -->
    <section id="auth-section">
      <form id="signup-form">
        <h2>회원가입</h2>
        <label for="signup-name">이름</label>
        <input id="signup-name" name="name" autocomplete="name">
        <label for="signup-email">이메일</label>
        <input id="signup-email" name="email" autocomplete="username">
        <label for="signup-password">비밀번호</label>
        <input id="signup-password" name="password" type="password" autocomplete="new-password">
        <button type="submit" disabled>회원가입</button>
      </form>
      <form id="login-form">
        <h2>로그인</h2>
        <label for="login-email">이메일</label>
        <input id="login-email" name="email" autocomplete="username">
        <label for="login-password">비밀번호</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password">
        <button type="submit" disabled>로그인</button>
      </form>
    </section>
    <!-- 서버가 로그인 상태를 확인한 뒤 이 영역에 회원 정보를 표시합니다. -->
    <section id="user-section" hidden>
      <h2>로그인 완료</h2>
      <p><strong id="user-name"></strong>님, 환영합니다.</p>
      <p id="user-email"></p>
      <button id="logout-button" type="button">로그아웃</button>
    </section>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
