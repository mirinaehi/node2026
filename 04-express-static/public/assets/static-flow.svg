  <path d="M424 104L436 116L424 128" stroke="#2764D8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="88" y="226" width="464" height="118" rx="16" fill="#FFFFFF" stroke="#B9C6DA" stroke-width="3"/>
  <text x="320" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#174EA6">app.use(express.static("public"))</text>
