<svg width="640" height="420" viewBox="0 0 640 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Express 정적 파일 제공 흐름</title>
  <desc id="desc">브라우저 요청이 Express를 거쳐 public 폴더의 HTML, CSS, JS, 이미지 파일로 연결되는 흐름</desc>
  <rect width="640" height="420" rx="24" fill="#E8F0FE"/>
  <rect x="54" y="70" width="148" height="92" rx="14" fill="#FFFFFF" stroke="#B9C6DA" stroke-width="3"/>
  <rect x="246" y="70" width="148" height="92" rx="14" fill="#FFFFFF" stroke="#B9C6DA" stroke-width="3"/>
  <rect x="438" y="70" width="148" height="92" rx="14" fill="#FFFFFF" stroke="#B9C6DA" stroke-width="3"/>
  <text x="128" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933">Browser</text>
  <text x="320" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933">Express</text>
  <text x="512" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2933">public</text>
  <text x="512" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2933">folder</text>
  <path d="M208 116H238" stroke="#2764D8" stroke-width="5" stroke-linecap="round"/>
  <path d="M232 104L244 116L232 128" stroke="#2764D8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
