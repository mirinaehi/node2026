<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>페이지를 찾을 수 없습니다</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main class="layout narrow">
      <section class="content not-found">
        <p class="eyebrow">404</p>
        <h1>요청한 파일이나 페이지가 없습니다.</h1>
        <p>
          `public` 폴더 안에 없는 파일을 요청하면 마지막 404 미들웨어가 이 화면을 보냅니다.
        </p>
        <p><a class="text-link" href="/">홈으로 돌아가기</a></p>
      </section>
    </main>
  </body>
</html>
